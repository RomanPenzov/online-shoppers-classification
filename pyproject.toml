[project]
name = "online-shoppers-classification"
version = "0.1.0"
description = "Reproducible, feature-policy protected Online Shoppers classification"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.2",
  "pandas==3.0.5",
  "scikit-learn==1.9.0",
  "scipy>=1.14,<2",
  "matplotlib==3.11.1",
  "joblib>=1.4,<2",
  "threadpoolctl==3.6.0",
  "xgboost==3.4.1",
  "lightgbm==4.7.0",
  "catboost==1.2.10",
]
[project.scripts]
online-shoppers = "online_shoppers.cli:main"
[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "ty>=0.0.1,<1",
]
notebooks = [
    "ipykernel>=6,<8",
    "nbformat>=5,<6",
]
[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/online_shoppers"]
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks/archive"]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
[tool.ty.environment]
python-version = "3.12"
[tool.ty.src]
include = ["src"]
